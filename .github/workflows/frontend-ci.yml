name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'geoattend-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'geoattend-frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: geoattend-frontend

jobs:
  lint-and-build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: geoattend-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Build production bundle (Vite)
        run: npm run build
        env:
          VITE_API_URL: https://geoattend-h084.onrender.com
