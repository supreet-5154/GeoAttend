spring.application.name=geo-attend-backend
server.port=${PORT:8080}

# Database Configuration
# Driver is auto-detected by Spring Boot from the JDBC URL (e.g. jdbc:postgresql: or jdbc:mysql:)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/geoattend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:geoattend_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema initialization:
# Disabled by default (never) to protect live production databases (e.g. Neon).
# Set SPRING_SQL_INIT_MODE=always and SPRING_SQL_INIT_PLATFORM=postgresql if initializing a fresh database.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=true

# Dynamic schema initializer:
# Disabled by default (false) to prevent runtime DDL/DML execution in production (e.g. Render / Neon).
# Enable only when bootstrapping local development schema if needed.
schema.initializer.enabled=${SCHEMA_INITIALIZER_ENABLED:false}

# CORS configuration (comma-separated origins, e.g. https://geoattend.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

jwt.secret=${JWT_SECRET}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration